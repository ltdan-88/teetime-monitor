[project]
name = "teetime-monitor"
version = "0.4.0"
description = "Local TUI for monitoring a pc caddie club tee sheet, with weather overlay and tee-time analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "textual>=0.60",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
teetime-monitor = "src.tui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
