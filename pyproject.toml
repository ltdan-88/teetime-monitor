[project]
name = "teetime-monitor"
version = "0.39.6"
description = "Local TUI for monitoring a pc caddie club tee sheet, with weather overlay and tee-time analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # No playwright. The original spec (docs/spec-v1.md) assumed a headless Chromium
    # would be needed to log in and read the tee sheet; walking the real site
    # 2026-09-06 showed both are plain HTTP -- the tee sheet is public, and the login
    # is an ordinary form POST with no JS and no CSRF token (see scraper.py's module
    # docstring). The dependency outlived its last import by a long way and was finally
    # dropped 2026-09-17: it pulled a large package, and the install instructions built
    # on it told every user to download a Chromium binary nothing ever launched.
    "textual>=0.60",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
teetime-monitor = "src.tui:main"
# The unattended scraper the README's launchd agent runs (added 2026-09-17). Previously
# that agent invoked `python -m src.scrape_once`, which is a real trap: `-m` prepends the
# *working directory* to sys.path, and the agent's working directory has to be wherever
# your clubs/, data/ and .env live -- so if that happens to be a source checkout, the
# background scraper silently runs the working copy rather than the installed release,
# whatever state it's in mid-edit. A console script is resolved from the installed
# package instead, so the two can't be confused.
teetime-monitor-scrape = "src.scrape_once:main"
# Headless credential save+verify for the macOS Swift prototype's login (2026-09-18)
# -- see login_cli.py's own docstring for the stdin-JSON-in, stdout-JSON-out contract.
teetime-monitor-login = "src.login_cli:main"
# Headless ad hoc search for the macOS Swift prototype (2026-09-18) -- see
# search_cli.py's own docstring for the stdin-JSON-in, stdout-JSON-out contract.
teetime-monitor-search = "src.search_cli:main"
# Headless platform-directory refresh for the Swift prototype's add-a-club
# (2026-09-18) -- see directory_cli.py's own docstring for the contract.
teetime-monitor-directory-refresh = "src.directory_cli:main"
# Headless add-a-club (save as favorite + geocode) for the Swift prototype
# (2026-09-18) -- see add_club_cli.py's own docstring for the contract.
teetime-monitor-add-club = "src.add_club_cli:main"
# Headless "browse before saving" preview scrape for the Swift prototype
# (2026-09-25) -- see preview_club_cli.py's own docstring for the contract.
teetime-monitor-preview-club = "src.preview_club_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# club_directory_seed.json (2026-09-10) -- setuptools only bundles .py files by
# default; without this, `pip install .` silently drops the bundled club-directory
# snapshot, and every install (Homebrew included) loses the whole feature with no
# error at all. Found live: installed v0.7.0 via the real Homebrew formula and
# confirmed the file was actually missing from site-packages before adding this.
src = ["club_directory_seed.json"]

# Added 2026-09-16 (audit follow-up). Deliberately configured to match the code
# that already exists rather than to impose a new style on 10k lines: line-length
# 125 is just above this codebase's own p99.5 (116), so it catches genuinely
# runaway lines without reflowing the long, deliberately-prose docstrings this
# project uses as its design record. No formatter is enabled -- `ruff format`
# would rewrite those docstrings' hand-wrapped paragraphs, which is exactly the
# noisy diff the audit flagged as not worth it.
[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes -- unused imports/variables, undefined names
    "I",    # import sorting
    "B",    # bugbear -- real bug patterns, not style
    "UP",   # pyupgrade
    "C4",   # comprehension simplifications
]
ignore = [
    "E501",  # line length is enforced by line-length above, not per-line noqa
    "B008",  # function call in default arg -- used deliberately for Path defaults
]
