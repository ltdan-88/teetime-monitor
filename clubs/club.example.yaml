# Copy this file to clubs/<your-club-id>.yaml — the filename (without ".yaml") is that
# club's id, used both to pick it at startup and to namespace its credentials in .env.
# See ROADMAP.md Phase 0 for the multi-club design. You can save as many of these as
# you have clubs; if there's only one, the TUI skips the picker automatically.

# Your club's pc caddie numeric id — confirmed 2026-09-05 (see ROADMAP.md "Live site
# findings") that the tee sheet lives directly at a stable, no-login-needed URL built
# from this: https://www.pccaddie.net/clubs/<club_id>/app.php?cat=tt_timetable_course
# Find it by locating that URL for your own club (e.g. via its "book a tee time" link).
club_id: "<club_id>"

# A convenience default only. Course selection turned out to be a fixed short list
# (e.g. "18 Loch Tee 1" / "9 Loch Tee 1" / "6 Loch Platz" for a 27-hole club like this
# one), not a rotating dropdown — the weekly A/B/C loop combination shows as a separate
# on-page banner instead of changing what's selectable. See ROADMAP.md Phase 0.
default_course: ""
default_date: "today"   # or YYYY-MM-DD

# Used for the weather + daylight overlay (Phase 2) — Open-Meteo needs plain
# coordinates, no API key. Look up your club's coordinates once and hardcode them here.
location:
  lat: 0.0
  lon: 0.0

# Public holidays + school-vacation periods (Phase 2) — both tend to mean a busier
# course, factored into the Phase 5 crowd heatmap and the avoid_predicted_crowd
# preference (now part of the shared global settings, see below).
calendar:
  # ISO 3166-1 alpha-2 country code (e.g. "AT", "DE", "CH") — public holidays are
  # fetched automatically via the free Nager.Date API (https://date.nager.at/), no key
  # needed. Leave blank to skip public-holiday awareness.
  country_code: ""
  # No universal free API covers regional school-vacation calendars, so these are
  # entered by hand — just the date ranges that tend to make this specific course busier.
  vacation_ranges: []
  # vacation_ranges:
  #   - { start: "2026-07-04", end: "2026-09-15", label: "summer break" }

# How many days ahead the multi-day overview (Phase 4) pulls, including today.
overview_days: 5

# Estimated round duration, used to work out whether a tee time finishes before
# sunset (Phase 2 playability highlight) and how long weather is checked across
# (Phase 2's own round-length window). Also used to live here per club -- moved
# 2026-09-09 into the same shared file as availability/preferences/ai_assist above
# (direct request: "make pace speed adjustable in settings"), same reasoning as
# those earlier moves: nothing about your own typical pace actually varies by club
# here. Press `e` from the running app to adjust it (under "Timing & scraping"); a
# club file that still has its own round_duration_minutes below keeps working as a
# fallback (see tui._resolved_config()'s shallow merge) but no longer wins once the
# shared file has actually set one.
# round_duration_minutes:
#   nine: 120
#   eighteen: 240

# Your own name, used for personal stats (Phase 5). `friends` may turn out to be
# unnecessary — pc caddie has its own native friends list (manage it in the site itself,
# under My Account), and shows friends' real names while anonymizing everyone else as
# "Member (handicap)". If "any real name in the scraped data = a friend" holds up (see
# ROADMAP.md "Live site findings" — not yet confirmed), this field can be dropped.
identity:
  my_name: ""
  friends: []

# Your standing availability rules, weather comfort preferences, and scrape interval
# used to live here per-club — moved 2026-09-08 to one shared file instead (direct
# feedback: "i also want the settings/preferences to be global and not tied to a
# specific club" — your own availability and weather comfort don't change depending on
# which course you're checking, so duplicating them into every club's own YAML was
# never actually right). See `global_preferences.py`'s module docstring for where that
# file lives, or just press `e` from the running app (`OverviewScreen`/
# `DayDetailScreen`) — it edits that shared file directly, no manual YAML needed.

# Whether recommendations get AI-ranked, and which Claude model does it (ai_assist.py
# — see ROADMAP.md "AI placement" note) also used to live here per club — moved
# 2026-09-08 into the same shared file as availability/preferences above (direct
# request: "the ai feature should be an option in the settings menu"), same reasoning
# as that earlier move: nothing about wanting AI ranking on or off actually varies by
# club here. Press `e` from the running app to turn it on/pick a model; a club file
# that still has its own `ai_assist` block below keeps working as a fallback (see
# tui._resolved_config()'s shallow merge) but no longer wins once the shared file has
# actually set one. ANTHROPIC_API_KEY lives in .env either way.
# ai_assist:
#   enabled: true
#   model: "claude-opus-5"
