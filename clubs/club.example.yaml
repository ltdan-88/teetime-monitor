# Copy this file to clubs/<your-club-id>.yaml — the filename (without ".yaml") is that
# club's id, used both to pick it at startup and to namespace its credentials in .env.
# See ROADMAP.md Phase 0 for the multi-club design. You can save as many of these as
# you have clubs; if there's only one, the TUI skips the picker automatically.

# Your club's pc caddie numeric id — confirmed 2026-09-05 (see ROADMAP.md "Live site
# findings") that the tee sheet lives directly at a stable, no-login-needed URL built
# from this: https://www.pccaddie.net/clubs/<club_id>/app.php?cat=tt_timetable_course
# Find it by locating that URL for your own club (e.g. via its "book a tee time" link).
club_id: "<club_id>"

# A convenience default only. Course selection turned out to be a fixed short list
# (e.g. "18 Loch Tee 1" / "9 Loch Tee 1" / "6 Loch Platz" for a 27-hole club like this
# one), not a rotating dropdown — the weekly A/B/C loop combination shows as a separate
# on-page banner instead of changing what's selectable. See ROADMAP.md Phase 0.
default_course: ""
default_date: "today"   # or YYYY-MM-DD

# Used for the weather + daylight overlay (Phase 2) — Open-Meteo needs plain
# coordinates, no API key. Look up your club's coordinates once and hardcode them here.
location:
  lat: 0.0
  lon: 0.0

# Public holidays + school-vacation periods (Phase 2) — both tend to mean a busier
# course, factored into the Phase 5 crowd heatmap and the avoid_predicted_crowd
# preference below.
calendar:
  # ISO 3166-1 alpha-2 country code (e.g. "AT", "DE", "CH") — public holidays are
  # fetched automatically via the free Nager.Date API (https://date.nager.at/), no key
  # needed. Leave blank to skip public-holiday awareness.
  country_code: ""
  # No universal free API covers regional school-vacation calendars, so these are
  # entered by hand — just the date ranges that tend to make this specific course busier.
  vacation_ranges: []
  # vacation_ranges:
  #   - { start: "2026-07-04", end: "2026-09-15", label: "summer break" }

# How many days ahead the multi-day overview (Phase 4) pulls, including today.
overview_days: 5

# Estimated round duration, used to work out whether a tee time finishes before sunset
# (Phase 2 playability highlight). Tune to your own/your group's typical pace.
round_duration_minutes:
  nine: 120
  eighteen: 240

# Safety margin subtracted before sunset — a round "finishing at sunset" isn't really
# playable, so this pads the cutoff earlier.
daylight_buffer_minutes: 30

# Your own name, used for personal stats (Phase 5). `friends` may turn out to be
# unnecessary — pc caddie has its own native friends list (manage it in the site itself,
# under My Account), and shows friends' real names while anonymizing everyone else as
# "Member (handicap)". If "any real name in the scraped data = a friend" holds up (see
# ROADMAP.md "Live site findings" — not yet confirmed), this field can be dropped.
identity:
  my_name: ""
  friends: []

# Your standing availability rules (Phase 3) — hard filters, applied automatically to
# every day in the overview so the week's recommended slots show up without you typing
# a search. Same shape as the ad hoc search form (Phase 4), just saved as your default.
# Example below: workdays only after 17:00, weekends only after 10:00, always solo.
# Leave a window out entirely (e.g. delete weekend_window) to skip that day type.
availability:
  min_open_spots: 1            # 1 = "always play alone"
  weekday_window:
    after: "17:00"
  weekend_window:
    after: "10:00"
  buffer_minutes: 20            # min gap to the nearest other booked flight

# Soft scoring weights (Phase 3 + 4) — how to rank slots that already pass the hard
# availability filter above. Shared by both the automatic weekly picks and ad hoc search.
#
# avoid_rain/avoid_wind are just on/off switches here, but recommend.py's
# exclude_unplayable() (the deterministic *hard* filter, not the AI ranking step) needs
# an actual number to compare against once one of them is true. Found as a genuine gap
# while implementing that function 2026-09-06 -- resolved with sensible defaults
# (50% rain probability, 1mm rain, 30kph wind) rather than blocking on it, but override
# them here if those aren't right for you:
# avoid_rain_probability_percent: 50
# avoid_rain_mm: 1.0
# avoid_wind_kph: 30
preferences:
  avoid_rain: true
  avoid_wind: true
  avoid_temp_below_c: 5
  avoid_temp_above_c: 32
  prioritize_friends: true
  avoid_predicted_crowd: true   # steer away from the Phase 5 heatmap's busy windows,
                                 # once there's enough history for it to say anything

# ai_assist.py (see ROADMAP.md "AI placement" note) — this is the actual mechanism
# behind tee-sheet parsing, recommendation ranking, and history summarization, not an
# optional bonus mode, so `enabled: false` means those features don't work, not just
# "less smart." `model` is yours to tune per club: a pricier model for a club whose
# ranking calls really matter to you, a cheaper one to keep the frequent parsing calls
# (every scrape, including the scheduled one) cheap. ANTHROPIC_API_KEY lives in .env.
ai_assist:
  enabled: true
  model: "claude-opus-5"
