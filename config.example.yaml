club_url: "https://online.pccaddie.net/<club-slug>"
default_course: ""
default_date: "today"   # or YYYY-MM-DD

# Used for the weather + daylight overlay (Phase 2) — Open-Meteo needs plain
# coordinates, no API key. Look up your club's coordinates once and hardcode them here.
location:
  lat: 0.0
  lon: 0.0

# How many days ahead the multi-day overview (Phase 3) pulls, including today.
overview_days: 5

# Estimated round duration, used to work out whether a tee time finishes before sunset
# (Phase 2 playability highlight). Tune to your own/your group's typical pace.
round_duration_minutes:
  nine: 120
  eighteen: 240

# Safety margin subtracted before sunset — a round "finishing at sunset" isn't really
# playable, so this pads the cutoff earlier.
daylight_buffer_minutes: 30

# Your own name and friends' names as they appear on the tee sheet, plain text match
# against scraped player names. Powers friend-spotting (Phase 3) and personal stats
# (Phase 5) — no dependence on pc caddie marking friends specially in its own HTML.
identity:
  my_name: ""
  friends: []

# Drives the "pick for me" recommended slot (Phase 3). Tune to how you actually golf.
preferences:
  time_of_day: "either"       # "morning", "afternoon", or "either"
  group: "either"              # "solo", "with_others", or "either"
  avoid_rain: true
  avoid_wind: true
  avoid_temp_below_c: 5
  avoid_temp_above_c: 32
  prioritize_friends: true
