# Builds and verifies the portable Windows app (windows/build_portable.py) without cutting a
# release: on demand, and on pull requests that touch what goes into it. The release workflow
# runs the same two steps and then attaches the zip to the Release.
name: windows-portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-portable.yml"

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build the portable zip
        run: python windows/build_portable.py

      - name: Verify it in a clean environment
        run: python windows/verify_portable.py

      - uses: actions/upload-artifact@v4
        with:
          name: TeetimeMonitor-windows-x64
          path: windows/dist/*.zip
          retention-days: 7
