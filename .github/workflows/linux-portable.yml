# Builds and verifies the portable Linux app (linux/build_portable.py) without cutting a release:
# on demand, and on pull requests that touch what goes into it. The release workflow runs the
# same steps and then attaches the tarball to the Release.
name: linux-portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "linux/**"
      - "pyproject.toml"
      - ".github/workflows/linux-portable.yml"

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build the portable tarball
        run: python linux/build_portable.py

      - name: Verify it in a clean environment
        run: python linux/verify_portable.py

      - name: Run it on the oldest supported glibc (AlmaLinux 8)
        run: |
          dir=$(mktemp -d)
          tar xzf linux/dist/TeetimeMonitor-*-linux-x86_64.tar.gz -C "$dir"
          docker run --rm -v "$dir":/t almalinux:8 /t/TeetimeMonitor/TeetimeMonitor.sh --version
          docker run --rm -v "$dir":/t almalinux:8 /t/TeetimeMonitor/TeetimeMonitor.sh --doctor --offline

      - uses: actions/upload-artifact@v4
        with:
          name: TeetimeMonitor-linux-x86_64
          path: linux/dist/*.tar.gz
          retention-days: 7
