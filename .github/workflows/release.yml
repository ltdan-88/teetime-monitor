name: release

# Runs when a version tag is pushed (v0.66.0). Added 2026-10-05 so the release tail
# stops being a hand-run sequence: it refuses a tag that doesn't match pyproject.toml
# or isn't on main, publishes a GitHub Release, and (when a token is configured)
# points the Homebrew tap at the new tarball.
#
# One-time setup for the tap step: create a fine-grained personal access token with
# "Contents: read and write" on ltdan-88/homebrew-teetime-monitor and store it as the
# repository secret TAP_GITHUB_TOKEN. Without it the job still succeeds and says to run
# scripts/update_tap.sh by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches pyproject.toml and is on main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $declared"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit is not on main"
            exit 1
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Update the Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN is not set -- run: scripts/update_tap.sh $version"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ltdan-88/homebrew-teetime-monitor.git" /tmp/tap
          git -C /tmp/tap config user.name "github-actions[bot]"
          git -C /tmp/tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/update_tap.sh "$version" /tmp/tap

  # The self-contained Mac app (2026-10-10): TeetimeMonitor.app with its own Python, for friends
  # without Homebrew or a terminal. Built and checked on an Apple Silicon runner, then attached to
  # the Release the job above created. Ad-hoc signed, NOT notarized (see docs/MAC-APP.md). The
  # zip is only uploaded if macos/verify_standalone.sh passes. Runs after `release`, so a failure
  # here never holds back the Release or the Homebrew tap update.
  mac-app:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build the app zip
        run: macos/build_standalone.sh

      - name: Verify it in a clean environment
        run: macos/verify_standalone.sh

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" macos/dist/TeetimeMonitor-*-arm64.zip macos/dist/TeetimeMonitor-*-arm64.zip.sha256 --clobber

  # The portable Windows app (2026-10-10): built, checked in a clean environment on a Windows
  # runner (windows/verify_portable.py), then attached to the Release next to the Mac zip.
  windows-app:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build the portable zip
        run: python windows/build_portable.py

      - name: Verify it in a clean environment
        run: python windows/verify_portable.py

      - name: Attach to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" windows/dist/TeetimeMonitor-*-windows-x64.zip windows/dist/TeetimeMonitor-*-windows-x64.zip.sha256 --clobber

  # The portable Linux app (2026-10-10): built and checked on a Linux runner, then run once more
  # inside AlmaLinux 8 (glibc 2.28, the oldest system the wheels support), and attached to the Release.
  linux-app:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build the portable tarball
        run: python linux/build_portable.py

      - name: Verify it in a clean environment
        run: python linux/verify_portable.py

      - name: Run it on the oldest supported glibc (AlmaLinux 8)
        run: |
          dir=$(mktemp -d)
          tar xzf linux/dist/TeetimeMonitor-*-linux-x86_64.tar.gz -C "$dir"
          docker run --rm -v "$dir":/t almalinux:8 /t/TeetimeMonitor/TeetimeMonitor.sh --version
          docker run --rm -v "$dir":/t almalinux:8 /t/TeetimeMonitor/TeetimeMonitor.sh --doctor --offline

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" linux/dist/TeetimeMonitor-*-linux-x86_64.tar.gz linux/dist/TeetimeMonitor-*-linux-x86_64.tar.gz.sha256 --clobber
